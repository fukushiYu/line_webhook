# 請在 settings.local.yaml 中設定取代
gemini_api_key:
  - '請在 settings.local.yaml 中設定 API Key'
llm_model: 'gemini-3.1-flash-lite'
scoring_mode: 'v3'
# scoring_mode: 'v1'  # V1: 3 次 Gemini（OCR → scoring→.md → md_to_html→.html）
# scoring_mode: 'v2'  # V2: 2 次 Gemini（OCR → scoring 直出 .html），合併 scoring + md_to_html
# scoring_mode: 'v3'  # V3: 1 次 Gemini（圖片 → OCR + 評分 + 直出 .html），全部合併為單次呼叫
max_output_tokens: 32768
logo_url: 'https://arc.blossom-academy.uk/static/Kit/logo%20ver2.1-1_pdf.jpg'
gemini_ocr_prompt: '將圖片中的英文作文識別出來，不要做任何的修改，不要添加其他語詞'
gemini_audio_prompt: '將語音內容轉寫為文字，不要做任何的修改，不要添加其他語詞'
line:
  - channel_secret: '請在 settings.local.yaml 中設定'
    channel_access_token: '請在 settings.local.yaml 中設定'
    admin: '請在 settings.local.yaml 中設定'
    admin_prefix: "@小英"
    liff_uri: 'https://liff.line.me/1655962952-sRG07EcN'  
    endpoint_url: 'https://tpe-info.blossom-academy.uk/webhook/scorepage'
    rich_menu_id: '請在 settings.local.yaml 中設定'
  - channel_secret: '請在 settings.local.yaml 中設定'
    channel_access_token: '請在 settings.local.yaml 中設定'
    admin: '請在 settings.local.yaml 中設定'
    admin_prefix: "@ako"
    liff_uri: 'https://liff.line.me/1655962952-sRG07EcN'
    endpoint_url: 'https://tpe-info.blossom-academy.uk/webhook/scorepage'
    rich_menu_id: '請在 settings.local.yaml 中設定'

# https://arc.blossom-academy.uk/static/k-grade.jpg
flex_grade:
  type: bubble
  hero:
    type: image
    url: https://arc.blossom-academy.uk/static/fukushi/AF02.jpg 
    size: full
    aspectRatio: '3:4'
    aspectMode: cover
  body:
    type: box
    layout: vertical
    backgroundColor: '#1a2a4a'
    paddingAll: 20px
    contents:
    - type: text
      text: Blossom Academy
      color: '#a1b5cc'
      size: sm
      weight: bold
      align: center
    - type: button
      action:
        type: uri
        label: 評分結果...
        uri: $LIFF_URL$
      style: primary
      color: '#2c4a7c'
      margin: xl
      height: sm

# https://arc.blossom-academy.uk/static/k-wait.jpg
flex_wait:
